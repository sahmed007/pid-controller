[project]
name = "pid-controller"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Samad Ahmed", email = "samad@chamoylabs.com" }
]
requires-python = ">=3.15"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "notebook>=7.6.5",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[project.scripts]
pid-controller = "pid_controller:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
