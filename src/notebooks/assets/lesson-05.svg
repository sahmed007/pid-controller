<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title"><title id="title">Backward difference estimates error slope</title><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b77979"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:21px;fill:#f1e9e9}.line{fill:none;stroke:#f1e9e9;stroke-width:2}.accent{fill:none;stroke:#b77979;stroke-width:2.5}</style><rect width="1000" height="380" fill="#25272b"/><path d="M130 70V300H890" class="line"/><text x="90" y="75" text-anchor="middle">Error</text><text x="890" y="330" text-anchor="middle">Time</text><path d="M220 120L700 245" class="line"/><circle cx="220" cy="120" r="5" fill="#b77979"/><circle cx="700" cy="245" r="5" fill="#b77979"/><path d="M220 120V245H700" class="line"/><text x="180" y="190" text-anchor="middle">Δe</text><text x="450" y="277" text-anchor="middle">Δt</text><text x="540" y="100" text-anchor="middle">Slope ≈ Δe / Δt</text><text x="220" y="98" text-anchor="middle">Previous</text><text x="750" y="235" text-anchor="middle">Current</text></svg>