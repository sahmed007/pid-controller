<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title"><title id="title">Illustrative step response with overshoot and settling band</title><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b77979"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:21px;fill:#f1e9e9}.line{fill:none;stroke:#f1e9e9;stroke-width:2}.accent{fill:none;stroke:#b77979;stroke-width:2.5}</style><rect width="1000" height="380" fill="#25272b"/><path d="M100 50V305H920" class="line"/><text x="65" y="65" text-anchor="middle">Speed</text><text x="910" y="337" text-anchor="middle">Time</text><rect x="100" y="130" width="790" height="24" fill="#b77979" fill-opacity=".18"/><path d="M100 142H890" class="line"/><text x="820" y="112" text-anchor="middle">±2% band</text><path d="M105 300C180 300 205 70 330 80S430 190 535 158S640 135 890 142" class="accent"/><text x="330" y="55" text-anchor="middle">Peak / overshoot</text><path d="M580 150V305" class="line"/><text x="620" y="335" text-anchor="middle">Observed settling</text><text x="210" y="355" text-anchor="middle">10–90% rise: first crossings</text></svg>