<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title"><title id="title">Load disturbance enters the torque balance</title><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b77979"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:21px;fill:#f1e9e9}.line{fill:none;stroke:#f1e9e9;stroke-width:2}.accent{fill:none;stroke:#b77979;stroke-width:2.5}</style><rect width="1000" height="380" fill="#25272b"/><rect x="65" y="160" width="200" height="60" class="line"/><text x="165.0" y="196" text-anchor="middle">Motor torque</text><path d="M265 190H390" class="accent" marker-end="url(#a)"/><circle cx="420" cy="190" r="25" class="line"/><text x="415" y="198" text-anchor="middle">+</text><text x="455" y="155" text-anchor="middle">−</text><text x="420" y="55" text-anchor="middle">Load torque</text><path d="M420 80V160" class="accent" marker-end="url(#a)"/><path d="M450 190H560" class="accent" marker-end="url(#a)"/><rect x="565" y="160" width="180" height="60" class="line"/><text x="655.0" y="196" text-anchor="middle">Dynamics</text><path d="M745 190H850" class="accent" marker-end="url(#a)"/><text x="900" y="198" text-anchor="middle">Speed</text><text x="510" y="315" text-anchor="middle">Friction also opposes motion inside the dynamics.</text></svg>