<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title"><title id="title">Practical controller with saturation and measurement derivative</title><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b77979"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:21px;fill:#f1e9e9}.line{fill:none;stroke:#f1e9e9;stroke-width:2}.accent{fill:none;stroke:#b77979;stroke-width:2.5}</style><rect width="1000" height="380" fill="#25272b"/><rect x="80" y="100" width="180" height="60" class="line"/><text x="170.0" y="136" text-anchor="middle">P + I</text><path d="M260 130H390" class="accent" marker-end="url(#a)"/><circle cx="420" cy="130" r="24" class="line"/><text x="420" y="138" text-anchor="middle">Σ</text><path d="M445 130H540" class="accent" marker-end="url(#a)"/><rect x="545" y="100" width="180" height="60" class="line"/><text x="635.0" y="136" text-anchor="middle">Clip ±6 V</text><path d="M725 130H850" class="accent" marker-end="url(#a)"/><text x="905" y="135" text-anchor="middle">Motor</text><rect x="100" y="260" width="230" height="60" class="line"/><text x="215.0" y="296" text-anchor="middle">K<tspan baseline-shift="sub" font-size="15">d</tspan> × filtered slope</text><path d="M330 290H420" class="line"/><path d="M420 290V158" class="accent" marker-end="url(#a)"/><text x="205" y="240" text-anchor="middle">Slope = −Δω/Δt</text><path d="M635 160V205H170" class="line"/><path d="M170 205V165" class="accent" marker-end="url(#a)"/><text x="560" y="350" text-anchor="middle">Conditional integration uses the voltage bounds</text></svg>