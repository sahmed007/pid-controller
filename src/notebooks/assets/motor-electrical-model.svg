<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">DC motor equivalent circuit</title><desc id="desc">Clockwise current passes through winding resistance R and inductance L. The supply V has positive polarity at the top, as does the opposing back EMF source e sub b.</desc>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f1e9e9"/></marker>
<marker id="accent-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b77979"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#f1e9e9}
.line{fill:none;stroke:#f1e9e9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.accent{fill:none;stroke:#b77979;stroke-width:2.5;stroke-linecap:round}
.sub{font-size:15px;baseline-shift:sub}
.label{font-size:17px;fill:#c9cbd0}
.symbol{font-family:Georgia,serif;font-style:italic}
</style>
<rect width="800" height="400" fill="#25272b"/>

<path d="M140 165V110H270M370 110H430M550 110H660V165M660 245V310H140V245" class="line"/>
<circle cx="140" cy="205" r="40" class="line"/><text x="140" y="195" text-anchor="middle">+</text><text x="140" y="232" text-anchor="middle">−</text>
<text x="78" y="213" class="symbol">V</text>
<rect x="270" y="96" width="100" height="28" class="line"/><text x="320" y="53" text-anchor="middle" class="symbol">R</text>
<path d="M430 110a15 15 0 0 1 30 0a15 15 0 0 1 30 0a15 15 0 0 1 30 0a15 15 0 0 1 30 0" class="line"/><text x="490" y="53" text-anchor="middle" class="symbol">L</text>
<text x="253" y="152">+</text><text x="375" y="152">−</text><text x="413" y="152">+</text><text x="555" y="152">−</text>
<path d="M185 80H240" class="accent" marker-end="url(#accent-arrow)"/><text x="210" y="62" class="symbol" style="fill:#b77979">i</text>
<circle cx="660" cy="205" r="40" class="line"/><text x="660" y="195" text-anchor="middle">+</text><text x="660" y="232" text-anchor="middle">−</text>
<text x="720" y="213" class="symbol">e<tspan class="sub">b</tspan></text>

<text x="320" y="78" text-anchor="middle" class="label">Winding resistance</text>
<text x="490" y="78" text-anchor="middle" class="label">Winding inductance</text>
<text x="140" y="355" text-anchor="middle" class="label">Applied voltage</text>
<text x="660" y="355" text-anchor="middle" class="label">Back EMF</text>
<text x="210" y="41" text-anchor="middle" class="label">Current</text>
</svg>
