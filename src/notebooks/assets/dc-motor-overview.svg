<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
<title id="title">DC motor cross-section</title><desc id="desc">North and south poles flank a rotor. The magnetic field points right. Current out of the page at the left conductor produces an upward force; current into the page at the right conductor produces a downward force. The force pair produces clockwise torque.</desc>
<defs>
<marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#f1e9e9"/></marker>
<marker id="accent-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b77979"/></marker>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;font-size:22px;fill:#f1e9e9}
.line{fill:none;stroke:#f1e9e9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.accent{fill:none;stroke:#b77979;stroke-width:2.5;stroke-linecap:round}
.sub{font-size:15px;baseline-shift:sub}
.label{font-size:17px;fill:#c9cbd0}
.symbol{font-family:Georgia,serif;font-style:italic}
</style>
<rect width="800" height="400" fill="#25272b"/>

<rect x="105" y="125" width="75" height="160" class="line"/>
<rect x="620" y="125" width="75" height="160" class="line"/>
<text x="142" y="213" text-anchor="middle">N</text><text x="657" y="213" text-anchor="middle">S</text>
<circle cx="400" cy="205" r="85" class="line"/><circle cx="400" cy="205" r="13" class="line"/>
<path d="M215 85H585" class="line" marker-end="url(#arrow)"/><text x="400" y="51" text-anchor="middle" class="symbol">B</text><text x="400" y="73" text-anchor="middle" class="label">Magnetic field</text>
<circle cx="330" cy="205" r="10" class="line"/><circle cx="330" cy="205" r="3" fill="#f1e9e9"/>
<circle cx="470" cy="205" r="10" class="line"/><path d="M465 200L475 210M475 200L465 210" class="line"/>
<path d="M330 185V130" class="accent" marker-end="url(#accent-arrow)"/><path d="M470 225V280" class="accent" marker-end="url(#accent-arrow)"/>
<text x="305" y="155" class="symbol" style="fill:#b77979">F</text><text x="490" y="265" class="symbol" style="fill:#b77979">F</text>
<text x="295" y="213" class="symbol">i</text><text x="497" y="213" class="symbol">i</text>
<text x="540" y="135" class="label">Rotor</text><path d="M530 128H490L451 138" class="line"/>

<text x="142" y="310" text-anchor="middle" class="label">Magnet</text>
<text x="657" y="310" text-anchor="middle" class="label">Magnet</text>
<path d="M400 220V325" class="line"/><text x="400" y="348" text-anchor="middle" class="label">Shaft</text>
<text x="272" y="137" text-anchor="end" class="label">Force</text>
<text x="520" y="280" class="label">Force</text>
<text x="400" y="385" text-anchor="middle" class="label">Winding current: ⊙ out of page   ⊗ into page</text>
</svg>
