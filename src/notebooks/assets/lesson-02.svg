<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="title"><title id="title">Open-loop motor with independent load disturbance</title><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b77979"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:21px;fill:#f1e9e9}.line{fill:none;stroke:#f1e9e9;stroke-width:2}.accent{fill:none;stroke:#b77979;stroke-width:2.5}</style><rect width="1000" height="380" fill="#25272b"/><rect x="100" y="155" width="190" height="60" class="line"/><text x="195.0" y="191" text-anchor="middle">Fixed voltage</text><rect x="430" y="155" width="180" height="60" class="line"/><text x="520.0" y="191" text-anchor="middle">Motor</text><text x="825" y="190" text-anchor="middle">Speed</text><path d="M290 185H425" class="accent" marker-end="url(#a)"/><path d="M610 185H755" class="accent" marker-end="url(#a)"/><text x="520" y="60" text-anchor="middle">Load torque</text><path d="M520 80V150" class="accent" marker-end="url(#a)"/><text x="500" y="315" text-anchor="middle">Speed is observed, but does not change the command.</text></svg>